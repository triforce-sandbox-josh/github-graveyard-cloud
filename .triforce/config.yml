# Triforce: global settings for github-graveyard-cloud. Each team's domains, personas and
# standards live in its own folder (.triforce/<team>/team.yml), owned by that team.
# Read from the default branch, so changes apply after they merge.
# Migrated from github-graveyard's .triforce/owners.yaml (SPEC §12 step 3).
version: 1

context: >
  Repo: github-graveyard, a Next.js 16 + TypeScript app. Enter a GitHub username,
  get a tombstone for each abandoned repo with a deterministic, joke "cause of death".
  There are no user accounts, logins or sessions. app/ holds routes: the landing page,
  /[username] graveyard, /[username]/[repo] single grave, /api/og/** share-card image
  routes, and POST /api/dig (dig counter). lib/github.ts calls the GitHub REST API with
  server tokens (GITHUB_TOKENS); lib/digs.ts writes a per-login counter to Firestore via
  firebase-admin (FIREBASE_SERVICE_ACCOUNT); lib/analytics.ts and components/Analytics.tsx
  send Firebase/GA4 events from the browser; lib/epitaphs.ts holds the cause-of-death jokes;
  lib/og.tsx renders share cards; components/ is shared UI; next.config.ts maps Firebase env
  vars into the browser bundle. Folders are hints only: route on what a change does.

# The Triforce teams. Each is the GitHub team of the same name in the triforce-sandbox-josh org:
# who reviews is that team's membership on GitHub. Every owner here is a team; there are no roles
# (aitriforce-cloud spec/04 §4A.10 (e)).
teams:
  frontend: {}
  security: {}
  platform: {}
  # Design and Legal each have one GitHub member (trevor-coleman), so his own PRs touching their
  # folders could never be approved. A second owner each, picked at random from the repo's people.
  design: { also: [coolsoftwaretyler] }
  legal: { also: [markrickert] }

# Identity only: Slack IDs and an about line. Teams list who is on them.
people:
  joshuayoes: { slack: U0CK3LE6S6L, about: "Sandbox owner; security, CI and dependencies." }
  trevor-coleman: { slack: U0CJB6787JM, about: "Security, design and legal reviewer for the sandbox." }
  uheron: { slack: U0CHTTB9HFZ }
  silasjmatson: { slack: U0CJFV80F3P }

# Requester groups: who may start a Slack request, and which domains such a request may change
# without an up-front stop. A requester group is never a team, owner or approver.
# The requester's group decides what a request may change, so requests.as is not used.
requesters:
  marketing:
    members: [uheron]       # people keys; github: false allowed
    may_change: [shared-ui] # domain ids

# Owns this file and approves new team folders.
config_owners: [team:platform]

# Adds to the built-ins (.triforce/**, .github/workflows/**, .github/actions/**, CODEOWNERS).
# .github/** covers every GitHub file (dependabot.yml, PR and issue templates, ...), not only the
# built-in workflows, actions and CODEOWNERS (D-0160).
always_human:
  paths: [".env*", ".github/**"]
  owners: [team:security]

fallback_owners: [team:security]

# Global domains. Templates are config.yml-only (SPEC §4.3), so design's and legal's
# template-based domains live here, owned by those teams.
domains:
  visual-design:
    uses: ui
    level: advisory
    owners: [team:design]
    # Phase 2: design approves in Slack. v1 counts GitHub reviews only (a lint warning).
    review_surfaces: [github, slack]
    reason: What people see on the graveyard pages changed; design may want a look at the screenshots.

  legal-text:
    uses: legal
    level: advisory
    owners: [team:legal]

  demo-design:
    uses: ui
    level: advisory
    owners: [team:design]

# Slack requests (aitriforce-cloud spec/14-slack.md, SL1).
requests:
  enabled: true
  name: "the Graveyard site"
  shipped_note: "It goes out with the next release."

options:
  stale_approvals: zone-touch
  self_approval: when_sole_owner
  rationale: nudge
  merge_when_ready: true
  merge_method: squash

models:
  # Debug only (aitriforce-cloud ADR 0035, D-018): show the first line of the Anthropic API's own
  # error message on PR error lines. Turn it off again before outside teams use this repo.
  show_api_errors: true
  # OpenRouter model IDs (prod uses ANTHROPIC_BASE_URL=https://openrouter.ai/api).
  # Sonnet/Haiku only during plumbing; decided 2026-11-16.
  classifier: anthropic/claude-sonnet-5.5
  classifier_fallback: anthropic/claude-haiku-5.5
  reviewer_fallback: anthropic/claude-haiku-5.5
  prepare: anthropic/claude-sonnet-5.5
  persona: anthropic/claude-haiku-5.5
  triage: anthropic/claude-sonnet-5.5
  fixer: anthropic/claude-sonnet-5.5
  rebase: anthropic/claude-sonnet-5.5
  # Slack requests: request clarifies, request_fast reads each message.
  request: anthropic/claude-sonnet-5.5
  request_fast: anthropic/claude-haiku-5.5
  build: anthropic/claude-sonnet-5.5

ci:
  workflow: CI
  covers: "lint, typecheck, unit tests (Vitest), production build, Playwright screenshots"
  screenshots_artifact: triforce-screens
  wait_minutes: 1

autofix:
  enabled: true
  max_rounds: 3
  direct_commits: true
  max_direct_lines: 40
  test_command: "npm test"
  setup_command: "npm ci"

rebase:
  enabled: true
  trigger: command
  strategy: rebase

agents:
  branch_prefixes: ["claude/", "codex/", "copilot/"]
