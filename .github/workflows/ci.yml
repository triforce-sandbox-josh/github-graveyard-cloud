name: CI
# Public repo: GitHub-hosted runners are free here, so CI runs on PRs and pushes to main.
# Never point this at a self-hosted runner: on a public repo any fork PR could run code on it.
# Triforce matches this workflow by name (`ci.workflow: CI` in .triforce/config.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The landing page prerenders GitHub data at build time. CI has no GitHub token, so the build
  # (and the screenshots) talk to scripts/mock-github.mjs instead of api.github.com.
  # Not GITHUB_API_URL: Actions reserves GITHUB_* names and overrides that one with the real API.
  GRAVEYARD_GITHUB_API_URL: http://127.0.0.1:4010
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # IE, SE, PXA and BG are retired (in any case): ownership is the GitHub teams declared under teams: (see AGENTS.md).
      # Also rejects the old forms the teams registry replaced: people.<name>.roles, a team file's role:,
      # and requests.role.
      - name: "Triforce config: no retired roles"
        run: |
          failed=0
          # Upper case anywhere, as a word.
          if grep -rnE '\b(IE|SE|PXA|BG)\b' .triforce/; then
            echo "::error::Retired roles (IE, SE, PXA, BG) found in .triforce/. Use team: owners; see AGENTS.md."
            failed=1
          fi
          # Any case (ie, Pxa, bg) where a role name goes: on a line with role: or roles: (role:pxa, roles: [bg],
          # requests.role: ie), or as an entry of a block-style roles: list or map. A whole name only: "-" and "_"
          # are part of a name, so prose ("per se") and class names ("bg-black") elsewhere pass.
          if grep -rniE 'roles?[[:space:]]*:(.*[^A-Za-z0-9_-])?(ie|se|pxa|bg)([^A-Za-z0-9_-]|$)' .triforce/ ||
             awk 'FNR == 1 { r = 0 }
                  { match($0, /^[[:space:]]*/); ind = RLENGTH }
                  r && $0 !~ /^[[:space:]]*(#|$)/ && (ind < rind || (ind == rind && $0 !~ /^[[:space:]]*-/)) { r = 0 }
                  r && tolower($0) ~ /^[[:space:]]*(-[[:space:]]*)?["\047]?(ie|se|pxa|bg)["\047]?[[:space:]]*(:|$)/ { print FILENAME ":" FNR ": " $0; found = 1 }
                  /^[[:space:]]*roles[[:space:]]*:[[:space:]]*(#.*)?$/ { r = 1; rind = ind }
                  END { exit !found }' $(find .triforce -name '*.yml' -o -name '*.yaml'); then
            echo "::error::Retired roles (ie, se, pxa, bg, in any case) found as role names in .triforce/. Use team: owners; see AGENTS.md."
            failed=1
          fi
          # people.<name>.roles: a roles key inside the top-level people: block (block or flow style).
          if awk '/^people[[:space:]]*:/ { p = 1; next } /^[^[:space:]#]/ { p = 0 }
                  p && /(^[[:space:]]*|[{,][[:space:]]*)roles[[:space:]]*:/ { print FILENAME ":" FNR ": " $0; found = 1 }
                  END { exit !found }' .triforce/config.yml; then
            echo "::error::people.<name>.roles found in .triforce/config.yml. People are added to teams now (teams.<team>.also); see AGENTS.md."
            failed=1
          fi
          # A team file's role: (a team no longer wears a role).
          if grep -nE '^role[[:space:]]*:' .triforce/*/team.yml; then
            echo "::error::role: found in a team file. A team no longer wears a role: delete the line; see AGENTS.md."
            failed=1
          fi
          # requests.role: replaced by requester groups (block or flow style).
          if awk '/^requests[[:space:]]*:/ { p = 1; if ($0 ~ /[{,][[:space:]]*role[[:space:]]*:/) { print FILENAME ":" FNR ": " $0; found = 1 }; next }
                  /^[^[:space:]#]/ { p = 0 }
                  p && /(^[[:space:]]*|[{,][[:space:]]*)role[[:space:]]*:/ { print FILENAME ":" FNR ": " $0; found = 1 }
                  END { exit !found }' .triforce/config.yml; then
            echo "::error::requests.role found in .triforce/config.yml. Use a requesters: group instead; see AGENTS.md."
            failed=1
          fi
          # requests.as: not used once a requesters: block exists (the requester's group decides).
          if grep -qE '^requesters[[:space:]]*:' .triforce/config.yml &&
             awk '/^requests[[:space:]]*:/ { p = 1; if ($0 ~ /[{,][[:space:]]*as[[:space:]]*:/) { print FILENAME ":" FNR ": " $0; found = 1 }; next }
                  /^[^[:space:]#]/ { p = 0 }
                  p && /(^[[:space:]]*|[{,][[:space:]]*)as[[:space:]]*:/ { print FILENAME ":" FNR ": " $0; found = 1 }
                  END { exit !found }' .triforce/config.yml; then
            echo "::error::requests.as found in .triforce/config.yml next to requesters:. The requester's group decides what a request may change; delete requests.as; see AGENTS.md."
            failed=1
          fi
          exit "$failed"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (against the mock GitHub API)
        run: |
          node scripts/mock-github.mjs &
          sleep 1
          npm run build

  screens:
    # Before/after screenshots for Triforce's design review (artifact "triforce-screens").
    # Never fails CI: design review falls back to asking the author for screenshots.
    name: screenshots (design review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build head and base, then screenshot both (uses the runner's Chrome)
        run: |
          node scripts/mock-github.mjs &
          MOCK=$!
          trap 'kill $MOCK' EXIT
          sleep 1
          npm run build
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          (cd /tmp/base && npm ci && npm run build) || echo "::warning::base build failed; every screen will show as new"
          node scripts/screens.mjs /tmp/base "$PWD" /tmp/screens ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: triforce-screens
          path: /tmp/screens
          retention-days: 14
